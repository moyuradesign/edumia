name: Edumia integrated QA package

on:
  push:
    paths:
      - '.github/workflows/qa-package.yml'
      - 'scripts/browser-acceptance.mjs'
      - 'scripts/shared-host-preflight.php'
      - 'public/.htaccess'
      - 'resources/css/frontend/app.css'
      - 'resources/css/admin/app.css'
      - 'resources/js/frontend/modules/language.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-package:
    name: Build and test development snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: qa-only-root-ephemeral
          MYSQL_DATABASE: edumia_browser_qa
          MYSQL_USER: edumia_qa
          MYSQL_PASSWORD: qa-only-customer-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pqa-only-root-ephemeral --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15

    steps:
      - name: Checkout tested main
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, pdo_mysql, xml, tokenizer
          coverage: none

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked npm dependencies and compile assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Configure ephemeral PHPUnit environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run all quality checks
        run: |
          php scripts/verify-source-structure.php
          php artisan route:list > /tmp/edumia-route-list.txt
          php artisan test --fail-on-warning

      - name: Install pinned browser test tools (QA runner only)
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit

      - name: Prepare completely isolated customer installation
        env:
          EDUMIA_QA_INSTALL_CODE: qa-only-installer-auth-2026
        run: |
          set -Eeuo pipefail
          QA_ROOT="/tmp/edumia-customer-${GITHUB_RUN_ID}"
          mkdir -p "$QA_ROOT"
          tar -cf - --exclude='./.git' --exclude='./.env' --exclude='./node_modules' \
            --exclude='./dist' --exclude='./qa-browser-evidence' --exclude='./.phpunit.cache' . \
            | tar -xf - -C "$QA_ROOT"
          test ! -e "$QA_ROOT/.env"
          test ! -e "$QA_ROOT/storage/app/edumia-installed.lock"
          test -f "$QA_ROOT/public/build/manifest.json"
          test -f "$QA_ROOT/public/.htaccess"
          printf '%s' "$EDUMIA_QA_INSTALL_CODE" > "$QA_ROOT/installer/authorize.txt"
          chmod 600 "$QA_ROOT/installer/authorize.txt"
          echo "EDUMIA_QA_ROOT=$QA_ROOT" >> "$GITHUB_ENV"
          echo "EDUMIA_ISOLATED_INSTALL=PREPARED"

      - name: Read-only shared-host preflight before installation
        run: |
          set -Eeuo pipefail
          php scripts/shared-host-preflight.php --root="$EDUMIA_QA_ROOT" --document-root="$EDUMIA_QA_ROOT/public" --json > "$RUNNER_TEMP/edumia-preflight-before.json"
          php -r '$r=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); if ($r["failed"] !== 0) exit(1); echo "EDUMIA_SHARED_HOST_PREFLIGHT_BEFORE=PASS\n";' "$RUNNER_TEMP/edumia-preflight-before.json"

      - name: Start disposable customer web server
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:8765 -t "$EDUMIA_QA_ROOT/public" \
            > "$RUNNER_TEMP/edumia-qa-webserver.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/edumia-qa-server.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 4 http://127.0.0.1:8765/installer | grep -q "Edumia Installer"; then
              echo 'EDUMIA_INSTALLER_HTTP=READY'
              exit 0
            fi
            sleep 1
          done
          echo 'Disposable installer HTTP entry point is unavailable'
          exit 1

      - name: Exercise real HTTP installation and responsive browsers
        env:
          EDUMIA_QA_BASE_URL: http://127.0.0.1:8765
          EDUMIA_QA_INSTALL_CODE: qa-only-installer-auth-2026
          EDUMIA_QA_DATABASE: edumia_browser_qa
          EDUMIA_QA_DB_USER: edumia_qa
          EDUMIA_QA_DB_PASSWORD: qa-only-customer-password
          EDUMIA_QA_ADMIN_PASSWORD: QA-only-StrongPassword123!
          EDUMIA_QA_EVIDENCE: qa-browser-evidence
        run: node scripts/browser-acceptance.mjs

      - name: Validate installation artifacts without printing secrets
        run: |
          set -Eeuo pipefail
          test -s "$EDUMIA_QA_ROOT/.env"
          test -s "$EDUMIA_QA_ROOT/storage/app/edumia-installed.lock"
          test ! -e "$EDUMIA_QA_ROOT/installer/authorize.txt"
          grep -q '^APP_DEBUG="false"$' "$EDUMIA_QA_ROOT/.env"
          grep -q '^DB_CONNECTION="mysql"$' "$EDUMIA_QA_ROOT/.env"
          test -f "$EDUMIA_QA_ROOT/public/build/manifest.json"
          echo 'EDUMIA_CUSTOMER_INSTALLATION=PASS'

      - name: Verify Apache rewrite and Laravel asset routing on disposable QA
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            apache2 libapache2-mod-php8.3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl
          sudo a2enmod rewrite
          sudo a2dissite 000-default || true
          # Match the PHP runtime's ownership model used by per-account shared hosting.
          # These changes affect only the temporary QA installation.
          sudo chown -R www-data:www-data "$EDUMIA_QA_ROOT"
          cat <<EOF | sudo tee /etc/apache2/sites-available/edumia-qa.conf > /dev/null
          Listen 127.0.0.1:8766
          <VirtualHost 127.0.0.1:8766>
            ServerName localhost
            DocumentRoot "$EDUMIA_QA_ROOT/public"
            <Directory "$EDUMIA_QA_ROOT/public">
              Options +FollowSymLinks -Indexes
              AllowOverride All
              Require all granted
            </Directory>
            ErrorLog "$RUNNER_TEMP/edumia-apache-errors.log"
          </VirtualHost>
          EOF
          sudo a2ensite edumia-qa
          sudo apache2ctl configtest
          if ! sudo apache2ctl -k stop; then
            echo 'Apache was not yet running; starting isolated QA service.'
          fi
          if ! sudo apache2ctl -k start; then
            echo 'Apache startup diagnostics:'
            sudo apache2ctl configtest
            sudo tail -n 60 /var/log/apache2/error.log || true
            exit 1
          fi
          modules="$(apache2ctl -M 2>/dev/null)"
          printf '%s\n' "$modules" | grep -E 'rewrite_module|php_module' || true
          echo 'Checking actual Apache HTTP routes; modules alone are not an acceptance result.'
          for attempt in $(seq 1 20); do
            if curl -sS --max-time 5 -o /dev/null 'http://127.0.0.1:8766/courses'; then
              break
            fi
            sleep 1
          done
          status() {
            curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$1"
          }
          check_route() {
            local required="$1" destination="$2" actual
            actual="$(status "$destination")"
            echo "APACHE_HTTP=$actual PATH=${destination#http://127.0.0.1:8766}"
            if [ "$actual" != "$required" ]; then
              sudo tail -n 35 "$RUNNER_TEMP/edumia-apache-errors.log" || true
              exit 1
            fi
          }
          check_route 200 'http://127.0.0.1:8766/'
          check_route 200 'http://127.0.0.1:8766/courses'
          check_route 200 'http://127.0.0.1:8766/fr/courses'
          check_route 404 'http://127.0.0.1:8766/installer'
          check_route 404 'http://127.0.0.1:8766/.env'
          check_route 404 'http://127.0.0.1:8766/composer.json'
          asset="$(php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $m["resources/css/frontend/app.css"]["file"];' "$EDUMIA_QA_ROOT/public/build/manifest.json")"
          check_route 200 "http://127.0.0.1:8766/build/$asset"
          headers="$(curl -sSI --max-time 10 "http://127.0.0.1:8766/build/$asset")"
          test "${headers#*text/css}" != "$headers"
          echo 'EDUMIA_APACHE_SHARED_HOST_REWRITE=PASS'

      - name: Read-only installed shared-host preflight
        run: |
          set -Eeuo pipefail
          sudo -u www-data php "$EDUMIA_QA_ROOT/scripts/shared-host-preflight.php" --root="$EDUMIA_QA_ROOT" --document-root="$EDUMIA_QA_ROOT/public" --json > "$RUNNER_TEMP/edumia-preflight-installed.json"
          php -r '$r=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); if ($r["failed"] !== 0) exit(1); echo "EDUMIA_SHARED_HOST_PREFLIGHT_INSTALLED=PASS\n";' "$RUNNER_TEMP/edumia-preflight-installed.json"

      - name: Save public-page browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edumia-browser-evidence
          path: qa-browser-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare QA artifact without secrets
        run: |
          set -Eeuo pipefail
          test ! -f installer/authorize.txt
          rm -f .env
          find bootstrap/cache -maxdepth 1 -type f -name '*.php' -delete
          find storage/logs -maxdepth 1 -type f -name '*.log' -delete
          printf 'EDUMIA QA SNAPSHOT\nSOURCE_SHA=%s\nSTATUS=DEVELOPMENT_ONLY\nNOT_A_CUSTOMER_RELEASE=YES\n' "${GITHUB_SHA}" > QA_BUILD.txt
          mkdir -p dist
          tar -czf dist/edumia-integrated-qa.tar.gz \
            --exclude='node_modules' \
            --exclude='public/hot' \
            --exclude='public/storage' \
            app artisan bootstrap config database docs installer public resources routes scripts \
            storage tests vendor composer.json composer.lock package.json package-lock.json \
            phpunit.xml vite.config.js .env.example README.md QA_BUILD.txt
          tar -tzf dist/edumia-integrated-qa.tar.gz > /tmp/edumia-qa-archive-contents.txt
          grep -Fxq 'public/build/manifest.json' /tmp/edumia-qa-archive-contents.txt
          for required in \
            app/Models/Assignment.php \
            app/Models/SubmittedAssignment.php \
            app/Services/Learning/AssignmentService.php \
            app/Services/Learning/CourseFeedbackService.php \
            app/Http/Controllers/Instructor/AssignmentController.php \
            app/Http/Controllers/Student/AssignmentController.php \
            resources/views/instructor/assignments/gradebook.blade.php \
            resources/views/student/assignments/show.blade.php \
            resources/views/student/saved-courses.blade.php \
            tests/Feature/AssignmentWorkflowTest.php \
            tests/Feature/CourseFeedbackTest.php \
            docs/module-status.md \
            docs/feature-completion-audit.md \
            app/Models/Application.php \
            app/Services/Identity/InstructorApplicationService.php \
            app/Models/Ebook.php \
            app/Services/Content/EbookLibraryService.php \
            app/Models/LiveClass.php \
            app/Services/Learning/LiveClassService.php \
            resources/views/student/instructor-application.blade.php \
            resources/views/instructor/ebooks/form.blade.php \
            resources/views/instructor/live-classes/index.blade.php \
            tests/Feature/InstructorApplicationTest.php \
            tests/Feature/EbookLibraryTest.php \
            tests/Feature/LiveClassWorkflowTest.php \
            app/Models/KnowledgeBase.php \
            app/Http/Controllers/Admin/Content/KnowledgeBaseController.php \
            app/Services/Marketing/NewsletterSubscriptionService.php \
            app/Mail/NewsletterConfirmation.php \
            app/Services/Learning/ForumDiscussionService.php \
            database/migrations/2026_10_31_120000_create_forum_replies_table.php \
            app/Services/Identity/RoleManagementService.php \
            database/migrations/2026_10_31_120100_create_roles_and_grants_tables.php \
            app/Services/Learning/BootcampService.php \
            app/Http/Controllers/Admin/Reports/LearningReportController.php \
            resources/views/instructor/bootcamps/form.blade.php \
            resources/views/student/bootcamps/classroom.blade.php \
            tests/Feature/KnowledgeBaseWorkflowTest.php \
            tests/Feature/NewsletterConsentTest.php \
            tests/Feature/CourseForumWorkflowTest.php \
            tests/Feature/RolePermissionManagementTest.php \
            tests/Feature/BootcampWorkflowTest.php \
            tests/Feature/LearningReportsTest.php; do
            grep -Fxq "$required" /tmp/edumia-qa-archive-contents.txt
          done
          echo 'EDUMIA_QA_FEATURES=ASSESSMENTS_FEEDBACK_INSTRUCTORS_EBOOKS_LIVE_CLASSES_HELP_NEWSLETTER_FORUMS_RBAC_BOOTCAMPS_REPORTS'
          sha256sum dist/edumia-integrated-qa.tar.gz
          test ! -e .env
          echo 'EDUMIA_INTEGRATED_QA_PACKAGE=READY'

      - name: Upload development QA archive
        uses: actions/upload-artifact@v4
        with:
          name: edumia-integrated-qa
          path: dist/edumia-integrated-qa.tar.gz
          if-no-files-found: error
          retention-days: 14

# This workflow only builds a QA archive; it cannot deploy or alter any live database.
